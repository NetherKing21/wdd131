<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="W08 Prove Assignment">
    <meta name="author" content="Brayden McAllister">
    <title>Character Card</title>
    <link rel="stylesheet" href="styles.css">
    <script src="main.js" defer></script>

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Snortleblat Character Card">
    <meta property="og:description" content="Character card for a ttrpg game.">
    <meta property="og:url" content="https://netherking21.github.io/wdd131/charactercard/index.html">
    <meta property="og:image" content="images/largeImage.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="images/largeImage.png">
    <meta name="twitter:title" content="Snortleblat Character Card">
    <meta name="twitter:description" content="Character card for a ttrpg game.">
    <meta name="twitter:image" content="images/largeImage.png">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="favicon.ico">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
</head>
<body>
    <div class="card">
        <img src="images/snortleblat.webp" alt="Crocodile looking monster in a swamp." class="image">
        <p class="name">Snortleblat</p>
        <div class="stats"></div>
        <div class="buttons">
            <button id="attackedBtn">Attacked</button>
            <button id="levelUpBtn">Level Up</button>
        </div>
    </div>
</body>
</html>
